services:
  # PostgreSQL for LangGraph persistent storage
  langgraph-postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: ${LANGGRAPH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LANGGRAPH_POSTGRES_DB}
    ports:
      - "${LANGGRAPH_POSTGRES_PORT}:5432"
    volumes:
      - langgraph_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LANGGRAPH_POSTGRES_USER} -d ${LANGGRAPH_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  langgraph_postgres_data:
    driver: local