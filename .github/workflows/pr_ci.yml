name: PR CI - SQLFluff Linting and dbt Testing

on:
  pull_request:
    branches: [main, develop]
    paths: # Only trigger when relevant files change
      - "**.sql"
      - "capstone_project/**"
      - ".github/workflows/pr_ci.yml"

jobs:
  PR_CI:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}_${{ github.event.number }}
      SNOWFLAKE_CI_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE }}
      SNOWFLAKE_CI_PRIVATE_KEY_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE_PWD }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/capstone_project/.dbt
      DBT_PROJECT_DIR: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify project directory exists
        run: |
          echo "Listing repo root:"
          ls -la
          echo "Listing capstone_project (if present):"
          if [ -d "capstone_project" ]; then
            ls -la capstone_project
          else
            echo "ERROR: capstone_project directory not found at repo root."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install CI dependencies
        run: |
          uv sync --group pr_ci --no-dev

      - name: Run dbt deps
        run: |
          uv run dbt deps -t ci
        working-directory: capstone_project

      - name: Run dbt debug
        run: |
          uv run dbt debug -t ci
        working-directory: capstone_project


      - name: Run dbt tests
        run: |
          uv run dbt test -t ci
        working-directory: capstone_project
        