services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      # Connect to the Postgres container's internal port
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: db
      MB_SAMPLE_DATA: false
    volumes:
      - metabase_data:/var/lib/metabase/data
    networks:
      - metabase_net
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17.4
    container_name: metabase_db
    restart: always
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME}
      POSTGRES_USER: ${MB_DB_USER}
      POSTGRES_PASSWORD: ${MB_DB_PASS}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    networks:
      - metabase_net
    ports:
      - "5434:5432"

volumes:
  metabase_data:
    driver: local
  metabase_postgres_data:
    driver: local

networks:
  metabase_net:
    driver: bridge
