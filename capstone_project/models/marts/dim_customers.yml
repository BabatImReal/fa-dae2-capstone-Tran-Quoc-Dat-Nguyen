version: 2

models:
  - name: dim_customers
    description: "Customers dimension table with SCD Type 2 tracking for customer changes over time."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        description: "Surrogate key for the customer dimension (composite of customer_id and effective_from)"
        data_type: varchar
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique
      
      - name: customer_id
        description: "Natural key for the customer"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('stg__customers')
              field: customer_id
      
      - name: customer_unique_id
        description: "Unique identifier for the customer across the system"
        data_type: varchar
        constraints:
          - type: not_null
      
      - name: customer_zip_code_prefix
        description: "Zip code prefix of the customer's address"
        data_type: varchar
      
      - name: customer_city
        description: "City where the customer is located"
        data_type: varchar
        constraints:
          - type: not_null
      
      - name: customer_state
        description: "Brazilian state code where the customer is located"
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - accepted_values:
              values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      
      - name: is_current
        description: "Flag indicating if this is the current active record for the customer"
        data_type: boolean
        constraints:
          - type: not_null
      
      - name: effective_from
        description: "Timestamp when this version of the customer record became effective"
        data_type: timestamp_ntz
        constraints:
          - type: not_null
      
      - name: effective_to
        description: "Timestamp when this version of the customer record ceased to be effective (NULL for current records)"
        data_type: timestamp_ntz
      
      - name: loaded_at
        description: "Timestamp when this record was loaded into the data warehouse"
        data_type: timestamp_ltz
        constraints:
          - type: not_null
