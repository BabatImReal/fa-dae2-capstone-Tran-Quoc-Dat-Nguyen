version: 2

models:
  - name: dim_sellers
    description: "Sellers dimension."
    columns:
      - name: seller_key
        tests:
          - not_null
          - unique
      - name: seller_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg__sellers')
                field: seller_id
      - name: seller_state
        tests:
          - accepted_values:
              values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]