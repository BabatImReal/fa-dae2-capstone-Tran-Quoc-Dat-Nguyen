version: 2
models:
  - name: fact_orders
    description: "Order fact at order grain."

    tests:
      # Column pair comparison at table level (not under a column)
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: order_estimated_delivery_date
          column_B: order_purchase_timestamp
          or_equal: true
      
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: order_delivered_customer_date
          column_B: order_purchase_timestamp
          or_equal: true
          row_condition: "order_delivered_customer_date is not null"
      
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          column_A: order_approved_at
          column_B: order_purchase_timestamp
          or_equal: true
          row_condition: "order_approved_at is not null"

      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - product_id
            - seller_id

    columns:
      - name: order_key
        tests:
          - unique
          - not_null

      - name: order_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg__orders')
                field: order_id
      - name: order_status
        tests:
          - accepted_values:
              values:
                - created
                - approved
                - invoiced
                - processing
                - shipped
                - delivered
                - canceled
                - unavailable
          - dbt_expectations.expect_column_most_common_value_to_be_in_set:
              value_set: ['delivered', 'shipped']
              top_n: 2

      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: seller_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key
      - name: total_order_value
        description: "Total monetary value of the order in BRL"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 200000
              strictly: false
      - name: order_payment_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_payment')
                field: order_payment_key
      - name: order_review_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_reviews')
                field: order_review_key

      - name: order_estimated_delivery_date
        description: "Estimated delivery date promised to customer"
        tests:
          - not_null

      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key

      - name: shipping_tier
        description: "Categorizes shipping performance based on shipping_date"
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Unknown'
                - 'Excellent'
                - 'Good'
                - 'Average'
                - 'Below Average'
                - 'Poor'
      
      - name: review_tier
        description: "Categorizes customer satisfaction based on review_score"
        tests:
          - accepted_values:
              values:
                - 'No Review'
                - 'Excellent'
                - 'Good'
                - 'Average'
                - 'Poor'
                - 'Very Poor'
                - 'Invalid'

