version: 2

models:
  - name: int__order_items
    description: "Order-level aggregates from orders and order_items."
    columns:
      - name: order_id
        description: "Order grain (1 row per order)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__orders')
                field: order_id

      - name: order_status
        tests:
          - accepted_values:
              values:
                - created
                - approved
                - invoiced
                - processing
                - shipped
                - delivered
                - canceled
                - unavailable

      - name: shipping_date
        description: "Days from purchase to delivery; nullable if not delivered."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 36500
              inclusive: true
              config:
                where: "shipping_date is not null"

      - name: shipping_limit_date
        description: "Latest promised shipping handoff (order-level max)."

      - name: order_qty
        description: "Count of items in the order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 1000
              inclusive: true

      - name: total_order_value
        description: "(avg(price+freight) * count(items)) at order level."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000000000
              inclusive: true

      - name: order_check_flag
        description: "1 if estimated < actual delivered, else 0; null if either date missing."
        tests:
          - accepted_values:
              values: [0, 1]
              config:
                where: "order_check_flag is not null"
