version: 2

models:
  - name: stg__order_items
    description: "Staged olist_order_items"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg__orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              to: ref('stg__products')
              field: product_id
      - name: seller_id
        tests:
          - relationships:
              to: ref('stg__sellers')
              field: seller_id
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: freight_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0