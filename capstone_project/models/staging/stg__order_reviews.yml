version: 2

models:
  - name: stg__order_reviews
    description: "Staged olist_order_reviews with SCD Type 2 history"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
            - effective_from
    columns:
      - name: review_id
        description: "Natural key (composite) - not unique due to SCD Type 2"
        tests:
          - not_null
      - name: order_id
        description: "Natural key (composite) - not unique due to SCD Type 2"
        tests:
          - not_null
          - relationships:
              to: ref('stg__orders')
              field: order_id
              where: "is_current = true"  # Only check current records
      - name: review_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: review_creation_date
      - name: review_answer_timestamp
      - name: is_current
        description: "Boolean flag indicating if this is the current version"
        tests:
          - not_null
      - name: effective_from
        description: "Timestamp when this version became effective"
        tests:
          - not_null
      - name: effective_to
        description: "Timestamp when this version was superseded (NULL for current)"