version: 2

models:
  - name: stg__order_items
    description: "Staged olist_order_items"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg__disease')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              to: ref('stg__products')
              field: product_id
      - name: seller_id
        tests:
          - relationships:
              to: ref('stg__sellers')
              field: seller_id
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: freight_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: stg__order_reviews
    description: "Staged olist_order_reviews"
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - relationships:
              to: ref('stg__disease')
              field: order_id
      - name: review_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: review_creation_date
      - name: review_answer_timestamp

  - name: stg__customers
    description: "Staged olist_customers"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null
      - name: customer_zip_code_prefix
        tests:
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null

  - name: stg__products
    description: "Staged olist_products"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg__sellers
    description: "Staged olist_sellers"
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        tests:
          - not_null
      - name: seller_city
        tests:
          - not_null
      - name: seller_state
        tests:
          - not_null

  - name: stg__geolocation
    description: "Staged olist_geolocation"
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null
      - name: geolocation_lat
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: geolocation_lng
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180

  - name: stg__product_category_name_translation
    description: "Staged product_category_name_translation"
    columns:
      - name: product_category_name
        tests:
          - not_null
      - name: product_category_name_english
        tests:
          - not_null
