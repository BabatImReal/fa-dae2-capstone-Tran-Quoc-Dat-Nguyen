version: 2

models:
    - name: stg__sellers
      description: "Staged olist_sellers from raw source"
      columns:
        - name: seller_id
          description: "Unique seller identifier"
          tests:
            - not_null
            - unique
        - name: seller_zip_code_prefix
          tests:
            - not_null
        - name: seller_city
          tests:
            - not_null
        - name: seller_state
          tests:
            - not_null
        - name: source_system
          description: "Source system identifier"
          tests:
            - not_null
            - accepted_values:
                values: ['csv']
        - name: loaded_at
          description: "Timestamp when the record was loaded"
          tests:
            - not_null