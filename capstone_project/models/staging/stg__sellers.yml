version: 2

models:
    - name: stg__sellers
      description: "Staged olist_sellers with SCD Type 2 history"
      tests:
        - dbt_utils.unique_combination_of_columns:
            combination_of_columns:
              - seller_id
              - effective_from
      columns:
        - name: seller_id
          description: "Natural key - not unique due to SCD Type 2"
          tests:
            - not_null
        - name: seller_zip_code_prefix
          tests:
            - not_null
        - name: seller_city
          tests:
            - not_null
        - name: seller_state
          tests:
            - not_null
        - name: is_current
          description: "Boolean flag indicating if this is the current version"
          tests:
            - not_null
        - name: effective_from
          description: "Timestamp when this version became effective"
          tests:
            - not_null
        - name: effective_to
          description: "Timestamp when this version was superseded (NULL for current)"