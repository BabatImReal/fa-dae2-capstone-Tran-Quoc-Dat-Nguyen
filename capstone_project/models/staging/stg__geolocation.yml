version: 2

models:
    - name: stg__geolocation
      description: "Staged olist_geolocation"
      columns:
        - name: geolocation_zip_code_prefix
          tests:
            - not_null
        - name: geolocation_lat
          tests:
            - not_null
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                  min_value: -90
                  max_value: 90
        - name: geolocation_lng
          tests:
            - not_null
            - dbt_expectations.expect_column_values_to_be_between:
                arguments:
                  min_value: -180
                  max_value: 180