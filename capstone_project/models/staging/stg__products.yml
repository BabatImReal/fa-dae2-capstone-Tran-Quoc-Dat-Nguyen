version: 2

models:
    - name: stg__products
      description: "Staged olist_products from raw source. Note: Some products may have null categories - these are filtered out in int__products."
      columns:
        - name: product_id
          description: "Unique product identifier"
          tests:
            - not_null
            - unique
        - name: product_category_name
          description: "Product category name (can be null for uncategorized products, filtered in intermediate layer)"
        - name: source_system
          description: "Source system identifier"
          tests:
            - not_null
            - accepted_values:
                values: ['csv']
        - name: loaded_at
          description: "Timestamp when the record was loaded"
          tests:
            - not_null