version: 2

models:
  - name: stg__customers
    description: "Staged olist_customers with SCD Type 2 history"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_id
            - effective_from
    columns:
      - name: customer_id
        description: "Natural key - not unique due to SCD Type 2"
        tests:
          - not_null
      - name: customer_unique_id
        tests:
          - not_null
      - name: customer_zip_code_prefix
        tests:
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: is_current
        description: "Boolean flag indicating if this is the current version"
        tests:
          - not_null
      - name: effective_from
        description: "Timestamp when this version became effective"
        tests:
          - not_null
      - name: effective_to
        description: "Timestamp when this version was superseded (NULL for current)"