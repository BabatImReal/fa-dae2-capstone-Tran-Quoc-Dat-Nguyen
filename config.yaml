snowflake:
  stage_fqn: "SC_RAW_DATA.CSV_STAGE"
  table_fqn: "SC_RAW_DATA.raw_data"
  postgre_table: "SC_RAW_DATA.RAW_DATA_POSTGRE"


# PostgreSQL configuration
postgresql:
  schema: "staging"
  table: "user_events"

paths:
  # Root directory where external datasets are stored
  data_dir: "data/external"
  # Local target folder for the olistbr brazilian ecommerce dataset
  dlt_input_dir: "data/external"
  # Kaggle dataset identifier to download when using the collect script
  batch_dataset_id: "olistbr/brazilian-ecommerce"
  # A representative file to preview after download (optional)
  batch_dataset_preview: "olist_orders_dataset.csv"

# Column definitions
columns:
  # Columns for user events table
  user_events:
    - "event_id"
    - "user_id"
    - "session_id"
    - "event_type"
    - "event_timestamp"
    - "user_agent"
    - "ip_address"
    - "page_url"
    - "page_title"
    - "referrer"
    - "product_id"
    - "product_name"
    - "category"
    - "price"
    - "quantity"
    - "search_query"
    - "results_count"
    - "filters_applied"
    - "checkout_step"
    - "cart_value"
    - "item_count"
    - "ingested_at"

  # Columns for each CSV/table in the olist brazilian ecommerce dataset
  olist_orders:
    - "order_id"
    - "customer_id"
    - "order_status"
    - "order_purchase_timestamp"
    - "order_approved_at"
    - "order_delivered_carrier_date"
    - "order_delivered_customer_date"
    - "order_estimated_delivery_date"

  olist_order_items:
    - "order_id"
    - "order_item_id"
    - "product_id"
    - "seller_id"
    - "shipping_limit_date"
    - "price"
    - "freight_value"

  olist_order_payments:
    - "order_id"
    - "payment_sequential"
    - "payment_type"
    - "payment_installments"
    - "payment_value"

  olist_order_reviews:
    - "review_id"
    - "order_id"
    - "review_score"
    - "review_comment_message"
    - "review_creation_date"
    - "review_answer_timestamp"

  olist_customers:
    - "customer_id"
    - "customer_unique_id"
    - "customer_zip_code_prefix"
    - "customer_city"
    - "customer_state"

  olist_products:
    - "product_id"
    - "product_category_name"
    - "product_name_length"
    - "product_description_length"
    - "product_photos_qty"
    - "product_weight_g"
    - "product_length_cm"
    - "product_height_cm"
    - "product_width_cm"

  olist_sellers:
    - "seller_id"
    - "seller_zip_code_prefix"
    - "seller_city"
    - "seller_state"

  olist_geolocation:
    - "geolocation_zip_code_prefix"
    - "geolocation_lat"
    - "geolocation_lng"
    - "geolocation_city"
    - "geolocation_state"

  product_category_name_translation:
    - "product_category_name"
    - "product_category_name_english"