[project]
name = "fa-dae2-capstone-tran-quoc-dat-nguyen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.12.1",
    "dbt-core>=1.10.13",
    "dbt-snowflake>=1.10.2",
    "faker>=37.6.0",
    "kaggle>=1.7.4.5",
    "kagglehub>=0.3.13",
    "langchain-text-splitters>=1.1.0",
    "langchain[openai]>=1.1.0",
    "langgraph>=1.0.3",
    "langgraph-checkpoint-postgres>=3.0.1",
    "langsmith>=0.4.47",
    "pandas>=2.3.2",
    "pdfplumber>=0.11.8",
    "pinecone>=8.0.0",
    "polars>=1.33.0",
    "psycopg[binary]>=3.2.10",
    "pymupdf>=1.26.7",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.16.2",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "snowflake-connector-python[pandas]>=3.17.3",
    "streamlit>=1.51.0",
]

[dependency-groups]

pr_ci = [
    "ruff>=0.13.3",
    "sqlfluff>=3.5.0",
    "sqlfluff-templater-dbt>=3.5.0",
]

dev = [
    "apache-airflow==3.0.6",
    "apache-airflow-providers-postgres>=6.4.0",
    "apache-airflow-providers-snowflake>=6.6.0",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
    "sqlfluff>=3.5.0",
    "sqlfluff-templater-dbt>=3.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "PIE",    # flake8-pie
    "RET",    # flake8-return
]
ignore = [
    "S101",   # Allow assert statements (used in tests)
    "T201",   # Allow print statements (used for logging in scripts)
    "S311",   # Allow pseudo-random generators for non-cryptographic purposes (fake data)
    "S608",   # Allow SQL queries with f-strings when identifiers are validated
    "S110",   # Allow try-except-pass in specific cases (driver compatibility)
    "E501",   # Allow lines longer than 88 characters (fix manually if needed)
    "SIM117", # Allow nested with statements (readable in database connections)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "scripts", "dagster_orchestrator"]
force-sort-within-sections = true
combine-as-imports = true
